[tool.poetry]
name = "application-for-analysis-of-banking-transactions"
version = "0.1.0"
description = ""
authors = ["Kristina Rozhkova <kristina.rozhkova.2018@list.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.3"
flake8 = "^7.1.1"
black = "^24.10.0"
python-dotenv = "^1.0.1"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
pytest = "^8.3.4"
pandas-stubs = "^2.2.3.241126"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.1"
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line_length = 119
exclude = '''
(
    /(
        \.git
    )/
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'